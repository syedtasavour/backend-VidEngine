server {
  listen      3000;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Video uploads go through this proxy, so the default 1M body limit would
  # reject anything but a very short clip.
  client_max_body_size 1024M;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

  # The API is proxied under the same origin as the app, so the browser sends
  # cookies without any CORS configuration on the backend.
  location /api/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploading to Cloudinary happens inside the request, so a large file can
    # keep the connection open well past nginx's 60s default.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_request_buffering off;
  }

  # Hashed build assets are immutable, so they can be cached indefinitely.
  location /assets/ {
    expires    1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a stale shell will reference asset
  # hashes that no longer exist after a redeploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
